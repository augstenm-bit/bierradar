# BierRadar: einmal pro Woche die Filialen-Liste aus OpenStreetMap erneuern.
name: Filialen aktualisieren

on:
  schedule:
    - cron: "30 3 * * 1"   # Montag früh
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  filialen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Filialen holen
        working-directory: server
        run: python filialen.py filialen.json
      - name: Speichern, wenn sich etwas geändert hat
        run: |
          git config user.name "BierRadar-Abruf"
          git config user.email "bierradar-abruf@users.noreply.github.com"
          git add server/filialen.json
          if git diff --cached --quiet; then echo "Keine Änderungen."; else
            git commit -m "Filialen aktualisiert"
            for versuch in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
